<!doctype html>
<html lang="de" style="overflow-y: scroll">
  <head>
    <meta charset="utf-8" />
    <title>MUI · Moderne WebUI für Homematic CCU3 und OpenCCU</title>
    <meta name="description" content="MUI: die komplette WebUI für Homematic CCU3 und OpenCCU, neu gebaut. Bedienen, einrichten, verknüpfen, programmieren. Live per WebSocket, als App installierbar." />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MUI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <!-- Background of the app (styles.css --background); ThemeContext follows the switch in the menu -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <script>
      // The app's scripts and styles come from the add-on's server: lighttpd
      // forwards /addons/mui/assets/ to it (addon_installer/lighttpd.conf,
      // lite/lighttpd.conf). When the server isn't running they fail to load
      // and the page would stay white; this says why instead. A plain inline
      // script, so it works without them, and before them, so it hears their
      // errors (which don't bubble, only the capture phase gets them).
      (() => {
        const texts = {
          de: {
            title: 'MUI lässt sich nicht laden',
            text: 'Der Server des Add-ons antwortet nicht. Starten Sie das Add-on neu (in der WebUI der CCU unter Einstellungen → Systemsteuerung → Zusatzsoftware → Neustart) und laden Sie dann diese Seite neu.',
            help: 'Hilfe in der Anleitung',
            reload: 'Neu laden',
            stopped: 'Er läuft nicht.',
            reason: 'Seine letzte Meldung im Log:',
            starting: 'Er läuft, antwortet aber noch nicht. Startet er gerade, laden Sie die Seite in einer Minute neu.',
          },
          en: {
            title: 'MUI cannot be loaded',
            text: "The add-on's server is not responding. Restart the add-on (in the CCU's WebUI under Settings → Control panel → Additional software → Restart), then reload this page.",
            help: 'Help in the manual',
            reload: 'Reload',
            stopped: 'It is not running.',
            reason: 'Its last message in the log:',
            starting: 'It is running but not answering yet. If it is starting, reload the page in a minute.',
          },
        };
        const help = 'https://firsttris.github.io/ccu-addon-mui/installation.html#h%C3%A4ufige-probleme';
        let shown = false;
        const show = () => {
          const root = document.getElementById('root');
          // Already said, or the app is running and a part loaded later failed
          if (shown || !root || root.firstChild) return;
          shown = true;
          const t = /^de\b/i.test(navigator.language || '') ? texts.de : texts.en;
          const box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'color-scheme:light dark;max-width:32rem;margin:15vh auto 0;padding:0 1rem;font:16px/1.5 system-ui,sans-serif';
          const title = document.createElement('h1');
          title.style.fontSize = '1.25rem';
          title.textContent = t.title;
          const text = document.createElement('p');
          text.textContent = t.text;
          const link = document.createElement('a');
          link.href = help;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = t.help;
          const button = document.createElement('button');
          button.type = 'button';
          button.style.cssText = 'display:block;margin-top:1rem;font:inherit;padding:.4rem 1rem';
          button.textContent = t.reload;
          button.onclick = () => location.reload();
          const status = document.createElement('div');
          box.append(title, text, status, link, button);
          root.append(box);
          // Whether the server runs, and the line it stopped with: lighttpd
          // runs status.cgi without the server (addon_installer/status.cgi).
          // Not there on openccu-lite and in the dev server: then nothing.
          fetch('/addons/mui/status.cgi', { cache: 'no-store' })
            .then((response) => response.json())
            .then((state) => {
              const line = document.createElement('p');
              line.textContent = state.running ? t.starting : t.stopped;
              status.append(line);
              if (state.running || !state.reason) return;
              const label = document.createElement('p');
              label.textContent = t.reason;
              const reason = document.createElement('pre');
              reason.style.cssText = 'white-space:pre-wrap;word-break:break-word;font-size:.875rem;padding:.5rem;border:1px solid';
              reason.textContent = state.reason;
              status.append(label, reason);
            })
            .catch(() => {});
        };
        addEventListener(
          'error',
          (event) => {
            const el = event.target;
            const failed = el instanceof HTMLScriptElement || (el instanceof HTMLLinkElement && /stylesheet|modulepreload/.test(el.rel));
            if (!failed) return;
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
            else show();
          },
          true,
        );
      })();
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
