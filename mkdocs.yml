# Dokumentation als Website: https://firsttris.github.io/ccu-addon-mui/
# Quelle ist docs/, gebaut mit MkDocs Material (.github/workflows/docs.yml).
# Lokal: pip install -r requirements-docs.txt && mkdocs serve
site_name: ccu-addon-mui
site_description: >-
  MUI, die moderne WebUI für Homematic CCU3 und OpenCCU: bedienen, einrichten,
  verknüpfen, programmieren. Live per WebSocket, als App installierbar.
site_url: https://firsttris.github.io/ccu-addon-mui/
repo_url: https://github.com/firsttris/ccu-addon-mui
repo_name: firsttris/ccu-addon-mui
edit_uri: edit/main/docs/
copyright: >-
  Lizenz MIT · Homematic und Homematic IP sind Marken der eQ-3 AG.
  Dieses Projekt steht in keiner Verbindung zu eQ-3 oder OpenCCU.

docs_dir: docs
# Seiten als bedienung.html statt bedienung/: so stimmen die relativen Bildpfade
# der <img>-Tags, die auch auf GitHub funktionieren müssen
use_directory_urls: false
exclude_docs: |
  banner.svg

nav:
  - Übersicht: README.md
  - Für Anwender:
      - Installation: installation.md
      - Bedienung: bedienung.md
      - Einrichten: einrichten.md
      - Geräteunterstützung: geraete.md
      - Vergleich mit der CCU3-WebUI: vergleich-ccu3.md
  - Hintergrund:
      - Architektur: architektur.md
      - 'API: WebSocket-Protokoll': protokoll.md
      - Sicherheit: sicherheit.md
      - Tests: tests.md
      - Entwicklung: entwicklung.md

theme:
  name: material
  language: de
  logo: assets/icon.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Folgt der Systemeinstellung, umschaltbar wie in der App
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: de
  - git-revision-date-localized:
      type: date
      locale: de
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link zu diesem Abschnitt
      # Umlaute in Ankern behalten, damit #die-geräteseite wie auf GitHub funktioniert
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/ccu-addon-mui
      name: Quellcode auf GitHub
    - icon: material/download
      link: https://github.com/firsttris/ccu-addon-mui/releases/latest
      name: Neueste Version herunterladen
