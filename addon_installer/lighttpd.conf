# WebSocket proxy for MUI WebSocket server (supports HTTP and HTTPS/WSS):
# the app connects to /addons/mui/ws, /ws/mui serves apps from before and
# the device images
$HTTP["url"] =~ "^(/ws/mui|/addons/mui/ws$)" {
  proxy.server = ( "" => (
    ( "host" => "127.0.0.1", "port" => 8088 )
  ))
  proxy.header = ( 
    "upgrade" => "enable",
    "map-host-request" => ( "-" => "127.0.0.1" ),
    "map-host-response" => ( "127.0.0.1" => "-" )
  )
}

# The app's scripts and styles lie gzip-compressed only (lighttpd has no
# compression module): the server sends them with Content-Encoding gzip
$HTTP["url"] =~ "^/addons/mui/assets/" {
  proxy.server = ( "" => (
    ( "host" => "127.0.0.1", "port" => 8088 )
  ))
}

# MUI addon: CGI and SPA routing
$HTTP["url"] =~ "^/addons/mui/" {
  cgi.assign = ( ".cgi" => "" )
  # Exclude update-check.cgi and the assets from SPA rewriting
  $HTTP["url"] !~ "^/addons/mui/(update-check\.cgi|assets/|ws$)" {
    url.rewrite-if-not-file = ("^/addons/mui/(.*)" => "/addons/mui/index.html")
  }
}