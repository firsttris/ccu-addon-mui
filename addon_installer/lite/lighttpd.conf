# openccu-lite: occulited checks and copies this fragment
# (/usr/local/etc/config/lighttpd/mui.conf) at every install and lighttpd
# start; the add-on may not write there itself. Only proxying to this
# system, rewrites and conditions are allowed, and the paths stay under
# /addons/, where the session gate adds X-Occulite-Session
# (ccu-addon-howto docs/11-openccu-lite.md, "How pages are served").

# The WebSocket and the gzip-compressed assets come from the server. One
# directive per line: occulited's check reads a directive's value only up to
# the end of its line (occulited internal/system/lighttpdropin.go) and refuses
# the fragment otherwise.
$HTTP["url"] =~ "^/addons/mui/(ws|assets/)" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8088 ) ) )
  proxy.header = ( "upgrade" => "enable", "map-host-request" => ( "-" => "127.0.0.1" ), "map-host-response" => ( "127.0.0.1" => "-" ) )
}

# The app's routes (no dot in the path) are its index.html; occulited
# serves the files, so lighttpd cannot tell a file from a route itself
$HTTP["url"] !~ "^/addons/mui/(ws|assets/)" {
  url.rewrite-once = ( "^/addons/mui/[^.?]*(\?.*)?$" => "/addons/mui/index.html" )
}
