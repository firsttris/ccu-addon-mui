name: openccu-lite VM

# The add-on on a real openccu-lite: its x86_64 release image booted in QEMU
# (KVM on the runner), the add-on package built here installed through
# occulited, then go-server/litevm against it: login through the session gate,
# what the app reads, a room, its layout and the language kept over a restart,
# an update and a reboot, the levels configure and operate, a heating group,
# a value set with the event coming back and a setting through lite-rpc with
# the user's session, the app in Chrome, the data in openccu-lite's backup,
# no write errors in the journal, uninstall and install again, logout ends
# the connection (scripts/lite-vm-test.sh). Without a radio module: devices and
# pairing stay a test on real hardware.
#
# Runs when a pull request changes the openccu-lite part, every Monday against
# the newest openccu-lite release (it is still changing), before a release and
# by hand, there with a chosen openccu-lite release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'go-server/main_lite.go'
      - 'go-server/pkg/occulite/**'
      - 'go-server/pkg/websocket/gate.go'
      - 'go-server/pkg/websocket/*_lite.go'
      - 'go-server/litevm/**'
      - 'addon_installer/**'
      - 'scripts/lite-vm-test.sh'
      - '.github/workflows/lite-vm.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      lite-release:
        description: 'openccu-lite release tag (empty: the newest, pre-releases included)'
        required: false
        default: ''
  workflow_call:

concurrency:
  group: lite-vm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vm:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: QEMU with KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils unzip
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Which openccu-lite
        id: lite
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.lite-release }}
        run: |
          TAG=${WANTED:-$(gh release list -R hobbyquaker/openccu-lite --limit 1 --json tagName -q '.[0].tagName')}
          [ -n "$TAG" ] || { echo "no openccu-lite release found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "openccu-lite $TAG"

      - name: Cached image
        id: cache
        uses: actions/cache@v4
        with:
          path: lite-image
          key: openccu-lite-x86_64-ova-${{ steps.lite.outputs.tag }}

      - name: Download image
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lite-image
          gh release download "${{ steps.lite.outputs.tag }}" -R hobbyquaker/openccu-lite -D lite-image \
            -p 'openccu-lite-x86_64-ova-*.zip' -p 'openccu-lite-x86_64-ova-*.zip.sha256'
          cd lite-image && sha256sum -c ./*.zip.sha256

      - name: Install dependencies
        run: npm ci

      - name: Build add-on
        run: npm run build

      - name: Test on openccu-lite
        run: |
          scripts/lite-vm-test.sh lite-image/openccu-lite-x86_64-ova-*.zip mui-*-x86_64-lite.tar.gz

      - name: Summary
        if: always()
        run: |
          {
            echo "### openccu-lite ${{ steps.lite.outputs.tag }}"
            echo '```'
            cat lite-vm-out/timings.txt 2>/dev/null || echo "no timings"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-vm-logs
          path: lite-vm-out
          if-no-files-found: ignore
