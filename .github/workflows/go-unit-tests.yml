name: Go Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # The release workflow runs the same tests first
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: go-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Go tests
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet and format
        run: go vet ./... && test -z "$(gofmt -l .)"

      # -race: several handlers run in their own goroutines
      - name: Run unit tests with coverage
        run: go test -race ./... -covermode=atomic -coverprofile=coverage.out

      - name: Print coverage summary
        run: go tool cover -func=coverage.out

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload Go coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            go-server/coverage.out
            go-server/coverage.html
          if-no-files-found: ignore
