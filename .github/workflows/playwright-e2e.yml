name: Playwright E2E

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'
  # The release workflow runs the same tests first
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-frontend-mocked:
    name: Frontend E2E
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests with coverage
        run: rm -rf .nyc_output coverage/playwright && mkdir -p .nyc_output && PW_COVERAGE=1 npx playwright test --project=chromium --reporter=github,html

      - name: Generate Playwright coverage report
        if: always()
        run: npx nyc report --temp-dir .nyc_output --reporter=text-summary --reporter=html --reporter=lcov --report-dir coverage/playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Playwright coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage-report
          path: coverage/playwright/
          if-no-files-found: ignore

  visual:
    name: Screenshots
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The baselines come from this image: the same fonts and rendering on
    # every run (e2e/visual.spec.ts). Keep its version at the one of
    # @playwright/test in package.json; "Update screenshots" uses it too.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Install dependencies
        run: npm ci

      - name: Compare the screenshots
        run: npx playwright test visual --reporter=github,line
        env:
          VISUAL: '1'

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: test-results/
          if-no-files-found: ignore

  e2e-stack:
    name: Stack E2E (fake CCU)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend + server against the fake CCU
        run: npm run test:stack

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stack-test-results
          path: test-results/
          if-no-files-found: ignore
