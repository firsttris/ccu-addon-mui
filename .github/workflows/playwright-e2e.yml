name: Playwright E2E

# Changes to documentation alone don't build.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # The release workflow runs the same tests first
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # All jobs run in Microsoft's Playwright image: browser and system packages
  # are in it, nothing is installed, and the screenshots render the same on
  # every run. Its version must match @playwright/test, so it comes from the
  # lockfile instead of being written here.
  playwright-image:
    name: Playwright image
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Image of the @playwright/test version in package-lock.json
        id: version
        uses: firsttris/workflows/actions/playwright-image@v1

  # The add-on updating itself up to the new app in this browser (service
  # worker on): two builds, served as on the CCU (playwright.update.config.ts)
  e2e-update:
    name: Update E2E
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the installed and the new app, run the update
        run: npm run test:update

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-results
          path: test-results/
          if-no-files-found: ignore

  e2e-frontend-mocked:
    name: Frontend E2E
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend E2E tests with coverage
        run: npm run test:e2e:coverage:collect -- --project=chromium --reporter=github,html

      - name: Generate Playwright coverage report
        if: always()
        run: npm run test:e2e:coverage:report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Playwright coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage-report
          path: coverage/playwright/
          if-no-files-found: ignore

  visual:
    name: Screenshots
    needs: playwright-image
    runs-on: ubuntu-latest
    # The baselines come from this image (e2e/visual.spec.ts); "Update
    # screenshots" takes them in the same one
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Install dependencies
        run: npm ci

      - name: Compare the screenshots
        run: npx playwright test visual --reporter=github,line
        env:
          VISUAL: '1'

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: test-results/
          if-no-files-found: ignore

  e2e-stack:
    name: Stack E2E (fake CCU) ${{ matrix.shard }}/2
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    # The tests share one fake CCU and run one after the other, so they are
    # split across two runners, each with its own stack
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Pure Go; the image has no C compiler
      CGO_ENABLED: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run frontend + server against the fake CCU
        run: npm run test:stack -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stack-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
