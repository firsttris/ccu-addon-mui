# Baut docs/ mit MkDocs Material und veröffentlicht sie auf GitHub Pages:
# https://firsttris.github.io/ccu-addon-mui/
# Voraussetzung einmalig: Settings → Pages → Source "GitHub Actions"
# (configure-pages mit enablement schaltet das beim ersten Lauf selbst ein).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date braucht die Historie
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
