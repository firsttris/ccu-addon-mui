name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'
  # The release workflow runs the same build and attaches its archives
  workflow_call:

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Protocol types up to date
        run: npm run generate:protocol && git diff --exit-code src/types/protocol.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build

      # A .sha256 beside every archive, with the bare file name, so
      # `sha256sum -c` works and openccu-lite's catalogue verifies the download
      # (ccu-addon-howto docs/07-updates-and-releases.md)
      - name: Checksums
        run: for f in mui-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done

      # The add-on archives for the CCU (ARM, x86) and openccu-lite (aarch64, x86_64) with their
      # checksums, to install from a pull request; the release attaches them
      - name: Upload add-on archives
        uses: actions/upload-artifact@v4
        with:
          name: addon
          path: |
            mui-*.tar.gz
            mui-*.tar.gz.sha256
          if-no-files-found: error
