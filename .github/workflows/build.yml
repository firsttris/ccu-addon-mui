name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  # The release workflow runs the same build and attaches its archives
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Protocol types up to date
        run: npm run generate:protocol && git diff --exit-code src/types/protocol.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build

      # The add-on archives for ARM and x86, to install from a pull request; the release attaches them
      - name: Upload add-on archives
        uses: actions/upload-artifact@v4
        with:
          name: addon
          path: mui-*.tar.gz
          if-no-files-found: error
