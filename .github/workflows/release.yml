name: Release

# A tag vX.Y.Z releases that version: the button in "Bump version" (bump.yml) or
# `npm run release:patch|minor|major` on a checkout creates it. First the full CI (build, Go and
# Playwright tests, openccu-lite VM), then the shared GitHub release from firsttris/workflows, which checks the tag
# against package.json and attaches the add-on archives built by build.yml. The Go and Playwright tests are
# skipped when main's CI already passed them for this code (tested-on-main); the build always runs, it
# makes the archives. Run by hand on main: only the checks, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A release commit from "Bump version" changes only the version, so the
  # green push runs of the commit before it count
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    with:
      workflows: build.yml, go-unit-tests.yml, playwright-e2e.yml
    permissions:
      actions: read
      contents: read

  build:
    uses: ./.github/workflows/build.yml

  go:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/go-unit-tests.yml

  e2e:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/playwright-e2e.yml

  # The add-on installed on a real openccu-lite (VM), against a release known to work: a new
  # openccu-lite must not stop a release of ours. The Monday run of lite-vm.yml tests the newest.
  lite-vm:
    uses: ./.github/workflows/lite-vm.yml
    with:
      lite-release: v1.0.0

  release:
    needs: [tested, build, go, e2e, lite-vm]
    # Build and VM passed; the tests passed or main had already passed them
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.tested.result == 'success' && needs.build.result == 'success' && needs['lite-vm'].result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.go.result)
      && contains(fromJSON('["success", "skipped"]'), needs.e2e.result) }}
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: addon
      notes: |
        ## Welches Archiv?

        Das Archiv nicht entpacken, sondern in der WebUI unter *Einstellungen → Systemsteuerung → Zusatzsoftware* installieren.

        - **`mui-*-arm-ccu3-raspi.tar.gz`** (ARM): CCU3, OpenCCU auf Raspberry Pi 2/3/4/5 und auf ARM-Boards wie Tinkerboard oder ODROID
        - **`mui-*-x86_64-pc.tar.gz`** (x86_64): OpenCCU als VM (OVA für Proxmox, VMware, VirtualBox, Synology), als Docker- oder LXC-Container auf einem NAS oder Server, oder direkt installiert auf einem Mini-PC wie einem Intel NUC

        - **`mui-*-aarch64-lite.tar.gz`**, **`mui-*-x86_64-lite.tar.gz`**: [openccu-lite](https://github.com/hobbyquaker/openccu-lite) auf Raspberry Pi 3/4/5 bzw. als VM; dort am einfachsten über den Add-on-Katalog installieren

        Das falsche Archiv bricht bei der Installation mit „Error (2)“ ab. Neben jedem Archiv liegt eine `.sha256` zum Prüfen.
    permissions:
      contents: write
