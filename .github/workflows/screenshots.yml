name: Update screenshots

# Renews screenshots on the chosen branch and commits them: the baselines of
# e2e/visual.spec.ts, in the image the "Screenshots" check compares in, and
# the pictures of the documentation (bun run docs:screenshots). Run it after
# a change to the look on purpose, then push again (a commit of this
# workflow doesn't start the checks). "tiles" takes the moving pictures of
# the tiles in docs/geraete.md (bun run docs:tiles) on their own: an
# animation never comes out twice the same, so they change on every run.
on:
  workflow_dispatch:
    inputs:
      what:
        description: Which screenshots
        type: choice
        options: [both, tests, docs, tiles]
        default: both

permissions:
  contents: write

jobs:
  # The image the "Screenshots" check compares in, in the version of
  # @playwright/test from the lockfile (as in playwright-e2e.yml)
  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Image of the @playwright/test version in bun.lock
        id: version
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  update:
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The npm package brings the binary without curl or unzip, which the image lacks.
      # The image has no jq; node reads the version, in an assignment of its own so
      # that a failure stops the step instead of installing npm's latest Bun.
      - name: Set up Bun
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          npm install --global "bun@$version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Go
        if: inputs.what == 'both' || inputs.what == 'docs'
        uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Take the test screenshots
        if: inputs.what == 'both' || inputs.what == 'tests'
        run: bun --bun playwright test visual --update-snapshots --reporter=line
        env:
          VISUAL: '1'

      - name: Take the documentation pictures
        if: inputs.what == 'both' || inputs.what == 'docs'
        run: bun run docs:screenshots

      # ffmpeg with libwebp joins the frames into animated WebP
      - name: Install ffmpeg
        if: inputs.what == 'tiles'
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg

      - name: Take the moving pictures of the tiles
        if: inputs.what == 'tiles'
        run: bun run docs:tiles

      - name: Commit what changed
        uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: |
            e2e/visual.spec.ts-snapshots
            docs/screenshot-*.png
            docs/kacheln
          message: Screenshots erneuert (${{ inputs.what }})
