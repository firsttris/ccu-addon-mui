name: Update screenshots

# Renews screenshots on the chosen branch and commits them: the baselines of
# e2e/visual.spec.ts, in the image the "Screenshots" check compares in, and
# the pictures of the documentation (bun run docs:screenshots). Run it after
# a change to the look on purpose, then push again (a commit of this
# workflow doesn't start the checks).
on:
  workflow_dispatch:
    inputs:
      what:
        description: Which screenshots
        type: choice
        options: [both, tests, docs]
        default: both

permissions:
  contents: write

jobs:
  # The image the "Screenshots" check compares in, in the version of
  # @playwright/test from the lockfile (as in playwright-e2e.yml)
  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout lockfile
        uses: actions/checkout@v4.1.1
        with:
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        run: echo "image=mcr.microsoft.com/playwright:v$(sed -n 's|.*\["@playwright/test@\([0-9.]*\)".*|\1|p' bun.lock | head -n 1)-noble" >> "$GITHUB_OUTPUT"

  update:
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      # The Playwright image brings Node but not Bun: npm installs the
      # version pinned in package.json (packageManager)
      - name: Set up Bun
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Go
        if: inputs.what != 'tests'
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Take the test screenshots
        if: inputs.what != 'docs'
        run: bunx playwright test visual --update-snapshots --reporter=line
        env:
          VISUAL: '1'

      - name: Take the documentation pictures
        if: inputs.what != 'tests'
        run: bun run docs:screenshots -- --reporter=line

      - name: Commit what changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots docs/screenshot-*.png
          if git diff --cached --quiet; then
            echo "The screenshots are up to date."
          else
            git commit -m "Screenshots erneuert (${{ inputs.what }})"
            git push
          fi
