name: Update screenshots

# Renews screenshots on the chosen branch and commits them: the baselines of
# e2e/visual.spec.ts, in the image the "Screenshots" check compares in, and
# the pictures of the documentation (npm run docs:screenshots). Run it after
# a change to the look on purpose, then push again (a commit of this
# workflow doesn't start the checks). "tiles" takes the moving pictures of
# the tiles in docs/geraete.md (npm run docs:tiles) on their own: an
# animation never comes out twice the same, so they change on every run.
on:
  workflow_dispatch:
    inputs:
      what:
        description: Which screenshots
        type: choice
        options: [both, tests, docs, tiles]
        default: both

permissions:
  contents: write

jobs:
  # The image the "Screenshots" check compares in, in the version of
  # @playwright/test from the lockfile (as in playwright-e2e.yml)
  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout lockfile
        uses: actions/checkout@v4.1.1
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        run: echo "image=mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)-noble" >> "$GITHUB_OUTPUT"

  update:
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Install dependencies
        run: npm ci

      - name: Set up Go
        if: inputs.what == 'both' || inputs.what == 'docs'
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Take the test screenshots
        if: inputs.what == 'both' || inputs.what == 'tests'
        run: npx playwright test visual --update-snapshots --reporter=line
        env:
          VISUAL: '1'

      - name: Take the documentation pictures
        if: inputs.what == 'both' || inputs.what == 'docs'
        run: npm run docs:screenshots

      # ffmpeg with libwebp joins the frames into animated WebP
      - name: Install ffmpeg
        if: inputs.what == 'tiles'
        run: apt-get update && apt-get install -y --no-install-recommends ffmpeg

      - name: Take the moving pictures of the tiles
        if: inputs.what == 'tiles'
        run: npm run docs:tiles

      - name: Commit what changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots docs/screenshot-*.png docs/kacheln
          if git diff --cached --quiet; then
            echo "The screenshots are up to date."
          else
            git commit -m "Screenshots erneuert (${{ inputs.what }})"
            git push
          fi
