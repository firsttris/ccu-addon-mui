name: Update screenshots

# Renews the screenshot baselines of e2e/visual.spec.ts on the chosen branch,
# in the image the "Screenshots" check compares in, and commits them. Run it
# after a change to the look on purpose, then push again (a commit of this
# workflow doesn't start the checks).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Install dependencies
        run: npm ci

      - name: Take the screenshots
        run: npx playwright test visual --update-snapshots --reporter=line
        env:
          VISUAL: '1'

      - name: Commit what changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "The screenshots are up to date."
          else
            git commit -m "Screenshots erneuert"
            git push
          fi
